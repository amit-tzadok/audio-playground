services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      default:
        aliases:
          - backend-svc
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A app.main.celery worker --loglevel=info
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - hf-cache:/root/.cache/huggingface
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_TOKEN=${HF_TOKEN}
      - ENHANCER_URL=http://enhancer:8100
    depends_on:
      - redis
      - enhancer

  enhancer:
    build: ./backend/enhancer
    volumes:
      - resemble-cache:/usr/local/lib/python3.11/site-packages/resemble_enhance/model_repo

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  hf-cache:
  resemble-cache:
