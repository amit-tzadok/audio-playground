services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      default:
        aliases:
          - backend-svc
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A app.main.celery worker --loglevel=info
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - hf-cache:/root/.cache/huggingface
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_TOKEN=${HF_TOKEN}
      - TTS_URL=http://tts:8200
    depends_on:
      - redis
      - tts

  tts:
    build: ./backend/tts
    volumes:
      - tts-model-cache:/root/.local/share/tts
      - whisper-cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  hf-cache:
  tts-model-cache:
  whisper-cache:
