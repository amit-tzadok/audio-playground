server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Written by docker-entrypoint.d/50-configure-auth.sh at container
    # start — a no-op locally, real basic auth when BASIC_AUTH_HTPASSWD
    # is injected (ECS deploy).
    include /etc/nginx/auth.conf;

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to backend service, stripping the /api prefix
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 200m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_connect_timeout 10s;
    }

    # Health check for K8s/ALB liveness probes — never gated behind auth,
    # since the load balancer can't supply credentials.
    location /healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
